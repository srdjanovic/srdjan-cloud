name = "srdjan-cloud"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# The /admin blog editor (functions/admin) needs these set on the Pages
# project (Dashboard → Workers & Pages → srdjan-cloud → Settings → Variables
# and Secrets, or `npx wrangler pages secret put NAME --project-name=srdjan-cloud`):
#   ADMIN_PASSWORD  long random password for /admin
#   SESSION_SECRET  random string used to sign session cookies
#   GITHUB_TOKEN    fine-grained PAT, Contents: read & write on this repo only
[vars]
GITHUB_REPO   = "srdjanovic/srdjan-cloud"
GITHUB_BRANCH = "main"
# Not secret; used by the admin Analytics tab (the analytics token can't list accounts)
CF_ACCOUNT_ID = "ba6f670773333e8b59453ff4676c8e80"
